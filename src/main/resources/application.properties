spring.application.name=vaultx-sp
# Required - full JDBC URL for Azure SQL Database
spring.datasource.url=jdbc:sqlserver://vaultx-server.database.windows.net:1433;database=vaultx_db;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;

# Username (note: Azure uses username@servername format internally, but here you use just the user part)
spring.datasource.username=vaultx-serv-ad

# Password
spring.datasource.password=Vault_X_Kings_2025

# Driver class (required for SQL Server)
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Recommended for Azure SQL + Hibernate/JPA
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
# DB-first approach ? schema is already defined in Azure, do not validate or alter it
spring.jpa.hibernate.ddl-auto=none
# helpful for debugging
spring.jpa.show-sql=true
# Prevent Hibernate 7 from converting camelCase @Column names to snake_case
# Your Azure DB columns are camelCase (createdAt, updatedAt etc.) so this must be set
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ?? JWT Configuration ?????????????????????????????????????????????????????????
jwt.secret=VaultX_Super_Secret_Key_2025_Must_Be_At_Least_32_Characters_Long!
# 24 hours in milliseconds
jwt.expiration=86400000

# ?? SpringDoc / Swagger UI ????????????????????????????????????????????????????
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

